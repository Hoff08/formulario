<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Alinhamento Audiovisual</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --text-color: #f5f5f7;
            --text-secondary: #86868b;
            --accent-color: #c5a880; /* Champagne Gold */
            --border-color: #2c2c2e;
            --focus-glow: rgba(197, 168, 128, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label.main-label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: #1c1c1e;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px var(--focus-glow);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }

        .checkbox-label:hover {
            color: var(--text-color);
        }

        input[type="checkbox"] {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .outro-input {
            margin-top: 10px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        button[type="submit"] {
            width: 100%;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }

        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .success-screen h2 {
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .checkbox-grid { grid-template-columns: 1fr; }
            .row { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="form-wrapper">
            <header>
                <h1>Alinhamento de Cobertura Audiovisual</h1>
                <p>Por favor, preencha as questões abaixo para estruturarmos a captação de acordo com a sua identidade.</p>
            </header>

            <form id="artistaForm">
                <!-- Informações Básicas -->
                <div class="form-group">
                    <label class="main-label">Nome artístico *</label>
                    <input type="text" id="nome_artistico" required placeholder="Ex: DJ Name">
                </div>

                <div class="form-group">
                    <label class="main-label">Instagram *</label>
                    <input type="text" id="instagram" required placeholder="Ex: @seuinstagram">
                </div>

                <div class="form-group">
                    <label class="main-label">Horário da apresentação *</label>
                    <input type="text" id="horario" required placeholder="Ex: 23:00 às 00:30">
                </div>

                <!-- Pergunta 1 -->
                <div class="form-group">
                    <label class="main-label">1. Como você gostaria que sua apresentação fosse retratada no vídeo?</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Energia intensa e impacto visual"> Energia intensa e impacto visual</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Clima calmo e imersivo"> Clima calmo e imersivo</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Conexão com o público"> Conexão com o público</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Performance técnica (mixagem, equipamentos)"> Performance técnica</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Emoção durante a apresentação"> Emoção durante a apresentação</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Público cantando e reagindo"> Público cantando e reagindo</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Atmosfera do evento"> Atmosfera do evento</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Luzes, lasers e efeitos especiais"> Luzes, lasers e efeitos</label>
                        <label class="checkbox-label"><input type="checkbox" name="q1" value="Bastidores"> Bastidores</label>
                    </div>
                    <input type="text" class="outro-input" id="q1_outro" placeholder="Outro...">
                </div>

                <!-- Pergunta 2 -->
                <div class="form-group">
                    <label class="main-label">2. O que você gostaria que tivesse mais destaque?</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Eu (DJ/Artista)"> Eu (DJ/Artista)</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="O público"> O público</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Minha interação com o público"> Minha interação com o público</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Palco"> O palco</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Estrutura do evento"> A estrutura do evento</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Iluminação"> A iluminação</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Efeitos especiais"> Os efeitos especiais</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Patrocinadores"> Patrocinadores</label>
                        <label class="checkbox-label"><input type="checkbox" name="q2" value="Amigos e convidados"> Amigos e convidados</label>
                    </div>
                    <input type="text" class="outro-input" id="q2_outro" placeholder="Outro...">
                </div>

                <!-- Pergunta 3 -->
                <div class="form-group">
                    <label class="main-label">3. Como você imagina o estilo do seu vídeo?</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Cinematográfico"> Cinematográfico</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Energético"> Energético</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Emocionante"> Emocionante</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Dark"> Dark</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Futurista"> Futurista</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Elegante"> Elegante</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Minimalista"> Minimalista</label>
                        <label class="checkbox-label"><input type="checkbox" name="q3" value="Comercial (divulgação)"> Comercial</label>
                    </div>
                    <input type="text" class="outro-input" id="q3_outro" placeholder="Outro...">
                </div>

                <!-- Pergunta 4 -->
                <div class="form-group">
                    <label class="main-label">4. Existe alguma música, remix ou momento específico do seu set que você gostaria que fosse registrado?</label>
                    <textarea id="q4" rows="3" placeholder="Insira detalhes da faixa ou do momento..."></textarea>
                </div>

                <!-- Pergunta 5 -->
                <div class="form-group">
                    <label class="main-label">5. Existe algum momento que você considera obrigatório aparecer?</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="q5" value="Entrada no palco"> Entrada no palco</label>
                        <label class="checkbox-label"><input type="checkbox" name="q5" value="Primeiro drop"> Primeiro drop</label>
                        <label class="checkbox-label"><input type="checkbox" name="q5" value="Último drop"> Último drop</label>
                        <label class="checkbox-label"><input type="checkbox" name="q5" value="Lançamento de música"> Lançamento de música</label>
                        <label class="checkbox-label"><input type="checkbox" name="q5" value="Interação com o público"> Interação com o público</label>
                        <label class="checkbox-label"><input type="checkbox" name="q5" value="Encerramento"> Encerramento</label>
                    </div>
                    <input type="text" class="outro-input" id="q5_outro" placeholder="Outro...">
                </div>

                <!-- Pergunta 6 -->
                <div class="form-group">
                    <label class="main-label">6. Existe alguma referência de vídeo ou foto que represente o estilo que você procura?</label>
                    <div class="checkbox-grid" style="margin-bottom: 15px;">
                        <label class="checkbox-label"><input type="checkbox" name="q6_plataforma" value="Instagram"> Instagram</label>
                        <label class="checkbox-label"><input type="checkbox" name="q6_plataforma" value="Pinterest"> Pinterest</label>
                        <label class="checkbox-label"><input type="checkbox" name="q6_plataforma" value="TikTok"> TikTok</label>
                        <label class="checkbox-label"><input type="checkbox" name="q6_plataforma" value="YouTube"> YouTube</label>
                        <label class="checkbox-label"><input type="checkbox" name="q6_plataforma" value="Outro"> Outro</label>
                    </div>
                    <textarea id="q6_links" rows="2" placeholder="Cole os links ou descreva as referências aqui..."></textarea>
                </div>

                <!-- Pergunta 7 -->
                <div class="form-group">
                    <label class="main-label">7. Existe algo que você prefere que não apareça nas imagens?</label>
                    <textarea id="q7" rows="2" placeholder="Ex: Marcas específicas, certos ângulos, etc..."></textarea>
                </div>

                <!-- Pergunta 8 -->
                <div class="form-group">
                    <label class="main-label">8. Se você pudesse resumir seu estilo de apresentação em três palavras, quais seriam?</label>
                    <div class="row">
                        <input type="text" id="q8_1" placeholder="Palavra 1">
                        <input type="text" id="q8_2" placeholder="Palavra 2">
                        <input type="text" id="q8_3" placeholder="Palavra 3">
                    </div>
                </div>

                <!-- Pergunta 9 -->
                <div class="form-group">
                    <label class="main-label">9. Alguma observação para a equipe de captação?</label>
                    <textarea id="q9" rows="3" placeholder="Informações adicionais para Kevin S. Hoffman e equipe..."></textarea>
                </div>

                <button type="submit" id="submitBtn">Enviar Respostas</button>
            </form>
        </div>

        <div class="success-screen" id="success-screen">
            <h2>Respostas Enviadas!</h2>
            <p style="color: var(--text-secondary);">Obrigado pelo preenchimento. As informações já foram compartilhadas com a equipe audiovisual.</p>
        </div>
    </div>

    <!-- Script Modular do Firebase utilizando as credenciais informadas -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDO8gtgOvD9nBd-Yvw12Rnzd91xYBBp8ko",
            authDomain: "videooo-e46e4.firebaseapp.com",
            projectId: "videooo-e46e4",
            storageBucket: "videooo-e46e4.firebasestorage.app",
            messagingSenderId: "209883943996",
            appId: "1:209883943996:web:67fd699a6d4fec9a36df39",
            measurementId: "G-BHEQY6MQJ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('artistaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Enviando...";

            const getCheckboxes = (name) => {
                return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
            };

            const formData = {
                nome_artistico: document.getElementById('nome_artistico').value,
                instagram: document.getElementById('instagram').value,
                horario: document.getElementById('horario').value,
                q1: getCheckboxes('q1'),
                q1_outro: document.getElementById('q1_outro').value,
                q2: getCheckboxes('q2'),
                q2_outro: document.getElementById('q2_outro').value,
                q3: getCheckboxes('q3'),
                q3_outro: document.getElementById('q3_outro').value,
                q4: document.getElementById('q4').value,
                q5: getCheckboxes('q5'),
                q5_outro: document.getElementById('q5_outro').value,
                q6_plataforma: getCheckboxes('q6_plataforma'),
                q6_links: document.getElementById('q6_links').value,
                q7: document.getElementById('q7').value,
                q8: [
                    document.getElementById('q8_1').value,
                    document.getElementById('q8_2').value,
                    document.getElementById('q8_3').value
                ].filter(Boolean),
                q9: document.getElementById('q9').value,
                timestamp: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "respostas_artista"), formData);
                document.getElementById('form-wrapper').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
            } catch (error) {
                console.error("Erro ao salvar dados: ", error);
                alert("Ocorreu um erro ao enviar suas respostas. Verifique se o Cloud Firestore está ativo.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Enviar Respostas";
            }
        });
    </script>
</body>
</html>
